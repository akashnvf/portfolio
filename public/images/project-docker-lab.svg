<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none">
  <rect width="600" height="360" rx="16" fill="#121216" />
  
  <!-- Docker Blue & Orange Accent theme -->
  <rect x="50" y="50" width="500" height="260" rx="14" fill="#17171F" stroke="#2496ED" stroke-width="1.8" />
  <rect x="75" y="38" width="160" height="24" rx="6" fill="#2496ED" />
  <text x="155" y="54" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">Docker Engine / Alpine</text>

  <!-- Docker container blocks -->
  <g transform="translate(80, 85)">
    <rect width="200" height="95" rx="8" fill="#1D202B" stroke="#333C4E" stroke-width="1.5" />
    <circle cx="25" cy="25" r="8" fill="#2496ED" />
    <text x="45" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">Nginx Reverse Proxy</text>
    <text x="25" y="60" fill="#B8B8BE" font-family="monospace" font-size="11">Image: nginx:alpine</text>
    <rect x="25" y="70" width="120" height="18" rx="4" fill="#2496ED" fill-opacity="0.2" />
    <text x="35" y="83" fill="#2496ED" font-family="monospace" font-size="10">Port: 0.0.0.0:80->80</text>
  </g>

  <g transform="translate(315, 85)">
    <rect width="200" height="95" rx="8" fill="#1D202B" stroke="#FF6A00" stroke-width="1.5" />
    <circle cx="25" cy="25" r="8" fill="#FF6A00" />
    <text x="45" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">Web Application Node</text>
    <text x="25" y="60" fill="#B8B8BE" font-family="monospace" font-size="11">Image: node:alpine (multi-stage)</text>
    <rect x="25" y="70" width="120" height="18" rx="4" fill="#FF6A00" fill-opacity="0.2" />
    <text x="35" y="83" fill="#FF8500" font-family="monospace" font-size="10">Port: 127.0.0.1:3000</text>
  </g>

  <!-- Bridge Network and Host Volume Area -->
  <g transform="translate(80, 205)">
    <rect width="435" height="85" rx="8" fill="#151720" stroke="#2B2D3B" />
    <text x="20" y="32" fill="#B8B8BE" font-family="sans-serif" font-size="12" font-weight="600">Container Bridge Network: <tspan fill="#2AC769">app-net (isolated)</tspan></text>
    <text x="20" y="58" fill="#8E8E98" font-family="monospace" font-size="11">Host Volume Mount: /var/www/html &lt;=&gt; /data/web (rw)</text>
    <text x="20" y="74" fill="#8E8E98" font-family="monospace" font-size="11">Healthcheck: curl -f http://localhost/health || exit 1</text>
  </g>
</svg>

