<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none">
  <rect width="600" height="360" rx="16" fill="#121216" />
  
  <rect x="40" y="45" width="520" height="270" rx="14" fill="#17171F" stroke="#33333F" stroke-width="1.5" />
  <text x="70" y="80" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">GitHub Actions Pipeline Workflow</text>
  <text x="70" y="100" fill="#8E8E98" font-family="monospace" font-size="11">on: [push, pull_request] -&gt; branch: main</text>

  <!-- Stage 1: Checkout & Lint -->
  <g transform="translate(65, 130)">
    <rect width="105" height="130" rx="8" fill="#1E202B" stroke="#2AC769" stroke-width="1.5" />
    <circle cx="52" cy="35" r="14" fill="#2AC769" fill-opacity="0.2" />
    <text x="52" y="39" text-anchor="middle" fill="#2AC769" font-family="sans-serif" font-size="14" font-weight="bold">✓</text>
    <text x="52" y="75" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">Lint &amp; Type</text>
    <text x="52" y="95" text-anchor="middle" fill="#8E8E98" font-family="monospace" font-size="9">ESLint / TSC</text>
    <text x="52" y="112" text-anchor="middle" fill="#2AC769" font-family="monospace" font-size="9">Passed (24s)</text>
  </g>

  <!-- Connector -->
  <path d="M175 195 L200 195" stroke="#FF6A00" stroke-width="2" />

  <!-- Stage 2: Security Scan -->
  <g transform="translate(205, 130)">
    <rect width="105" height="130" rx="8" fill="#1E202B" stroke="#2AC769" stroke-width="1.5" />
    <circle cx="52" cy="35" r="14" fill="#2AC769" fill-opacity="0.2" />
    <text x="52" y="39" text-anchor="middle" fill="#2AC769" font-family="sans-serif" font-size="14" font-weight="bold">✓</text>
    <text x="52" y="75" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">Audit &amp; Scan</text>
    <text x="52" y="95" text-anchor="middle" fill="#8E8E98" font-family="monospace" font-size="9">Trivy / Snyk</text>
    <text x="52" y="112" text-anchor="middle" fill="#2AC769" font-family="monospace" font-size="9">0 Highs (41s)</text>
  </g>

  <!-- Connector -->
  <path d="M315 195 L340 195" stroke="#FF6A00" stroke-width="2" />

  <!-- Stage 3: Container Build -->
  <g transform="translate(345, 130)">
    <rect width="105" height="130" rx="8" fill="#1E202B" stroke="#FF6A00" stroke-width="1.5" />
    <circle cx="52" cy="35" r="14" fill="#FF6A00" fill-opacity="0.2" />
    <text x="52" y="40" text-anchor="middle" fill="#FF8500" font-family="monospace" font-size="12" font-weight="bold">&gt;&gt;</text>
    <text x="52" y="75" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">Build Image</text>
    <text x="52" y="95" text-anchor="middle" fill="#8E8E98" font-family="monospace" font-size="9">Docker Buildx</text>
    <text x="52" y="112" text-anchor="middle" fill="#FF8500" font-family="monospace" font-size="9">Running...</text>
  </g>

  <!-- Connector -->
  <path d="M455 195 L480 195" stroke="#444455" stroke-width="2" stroke-dasharray="3 3" />

  <!-- Stage 4: Deploy / Release -->
  <g transform="translate(485, 130)">
    <rect width="60" height="130" rx="8" fill="#181922" stroke="#333344" stroke-width="1" />
    <text x="30" y="75" text-anchor="middle" fill="#8E8E98" font-family="sans-serif" font-size="10" font-weight="bold">Release</text>
    <text x="30" y="95" text-anchor="middle" fill="#555566" font-family="monospace" font-size="8">Pending</text>
  </g>
</svg>

