<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none">
  <rect width="600" height="360" rx="16" fill="#121216" />
  
  <!-- AWS Border -->
  <rect x="50" y="45" width="500" height="270" rx="14" fill="#16171D" stroke="#FF9900" stroke-width="1.8" stroke-dasharray="6 4" />
  <rect x="75" y="33" width="160" height="24" rx="6" fill="#FF9900" />
  <text x="155" y="49" text-anchor="middle" fill="#111116" font-family="sans-serif" font-size="11" font-weight="bold">AWS VPC: 172.16.0.0/16</text>

  <!-- AZ A -->
  <rect x="75" y="75" width="210" height="215" rx="10" fill="#1A1C24" stroke="#2C2E3C" />
  <text x="180" y="100" text-anchor="middle" fill="#FFB74D" font-family="sans-serif" font-size="12" font-weight="bold">Availability Zone 1 (us-east-1a)</text>

  <rect x="95" y="115" width="170" height="70" rx="6" fill="#222530" stroke="#3D4154" />
  <text x="180" y="137" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600">Public Subnet A</text>
  <text x="180" y="156" text-anchor="middle" fill="#2AC769" font-family="monospace" font-size="10">Internet Gateway Attached</text>

  <rect x="95" y="200" width="170" height="70" rx="6" fill="#222530" stroke="#FF6A00" stroke-width="1.2" />
  <text x="180" y="222" text-anchor="middle" fill="#FF8500" font-family="sans-serif" font-size="11" font-weight="600">Private Subnet A</text>
  <text x="180" y="241" text-anchor="middle" fill="#B8B8BE" font-family="monospace" font-size="10">EC2 Worker Instance</text>

  <!-- AZ B -->
  <rect x="315" y="75" width="210" height="215" rx="10" fill="#1A1C24" stroke="#2C2E3C" />
  <text x="420" y="100" text-anchor="middle" fill="#FFB74D" font-family="sans-serif" font-size="12" font-weight="bold">Availability Zone 2 (us-east-1b)</text>

  <rect x="335" y="115" width="170" height="70" rx="6" fill="#222530" stroke="#3D4154" />
  <text x="420" y="137" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600">Public Subnet B</text>
  <text x="420" y="156" text-anchor="middle" fill="#2AC769" font-family="monospace" font-size="10">NAT Gateway Attached</text>

  <rect x="335" y="200" width="170" height="70" rx="6" fill="#222530" stroke="#FF6A00" stroke-width="1.2" />
  <text x="420" y="222" text-anchor="middle" fill="#FF8500" font-family="sans-serif" font-size="11" font-weight="600">Private Subnet B</text>
  <text x="420" y="241" text-anchor="middle" fill="#B8B8BE" font-family="monospace" font-size="10">EC2 Worker Instance</text>
</svg>

