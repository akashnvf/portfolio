<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none">
  <rect width="600" height="360" rx="16" fill="#121216" />
  
  <!-- Code Editor Window -->
  <rect x="50" y="45" width="240" height="270" rx="12" fill="#181820" stroke="#33333F" stroke-width="1.5" />
  <rect x="50" y="45" width="240" height="34" rx="12" fill="#1F1F2A" />
  <circle cx="70" cy="62" r="5" fill="#FF5F56" />
  <circle cx="85" cy="62" r="5" fill="#FFBD2E" />
  <circle cx="100" cy="62" r="5" fill="#27C93F" />
  <text x="145" y="67" fill="#8E8E98" font-family="monospace" font-size="11">main.tf</text>

  <!-- Code snippet lines -->
  <text x="65" y="110" fill="#FF6A00" font-family="monospace" font-size="11">resource <tspan fill="#00BCF2">"azurerm_resource_group"</tspan></text>
  <text x="65" y="128" fill="#F5F5F5" font-family="monospace" font-size="11">  name     = <tspan fill="#2AC769">"rg-dev-prod"</tspan></text>
  <text x="65" y="146" fill="#F5F5F5" font-family="monospace" font-size="11">  location = <tspan fill="#2AC769">"eastus"</tspan></text>
  <text x="65" y="164" fill="#8E8E98" font-family="monospace" font-size="11">}</text>

  <text x="65" y="194" fill="#FF6A00" font-family="monospace" font-size="11">module <tspan fill="#00BCF2">"network"</tspan> {</text>
  <text x="65" y="212" fill="#F5F5F5" font-family="monospace" font-size="11">  source = <tspan fill="#2AC769">"./modules/vnet"</tspan></text>
  <text x="65" y="230" fill="#F5F5F5" font-family="monospace" font-size="11">  cidr   = <tspan fill="#2AC769">"10.0.0.0/16"</tspan></text>
  <text x="65" y="248" fill="#8E8E98" font-family="monospace" font-size="11">}</text>

  <rect x="65" y="270" width="210" height="28" rx="6" fill="#121217" stroke="#FF6A00" stroke-width="1" />
  <text x="80" y="288" fill="#FF8500" font-family="monospace" font-size="11">$ terraform apply -auto-approve</text>

  <!-- Arrow / Execution Pipeline -->
  <path d="M305 180 L345 180" stroke="#FF6A00" stroke-width="2.5" stroke-dasharray="4 4" />
  <polygon points="345,175 355,180 345,185" fill="#FF6A00" />

  <!-- Terraform Infrastructure Output Stack -->
  <rect x="360" y="45" width="190" height="270" rx="12" fill="#181820" stroke="#7B42BC" stroke-width="1.5" />
  <rect x="360" y="45" width="190" height="34" rx="12" fill="#201C2E" />
  <text x="455" y="67" text-anchor="middle" fill="#AC87FF" font-family="sans-serif" font-size="11" font-weight="bold">Provisioned Cloud State</text>

  <!-- Infrastructure layers -->
  <g transform="translate(375, 95)">
    <rect width="160" height="42" rx="6" fill="#242232" stroke="#3E3955" />
    <text x="80" y="26" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600">Virtual Network &amp; NSG</text>
  </g>

  <g transform="translate(375, 147)">
    <rect width="160" height="42" rx="6" fill="#242232" stroke="#3E3955" />
    <text x="80" y="26" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600">Subnet &amp; Security Rules</text>
  </g>

  <g transform="translate(375, 199)">
    <rect width="160" height="42" rx="6" fill="#242232" stroke="#FF6A00" stroke-width="1.5" />
    <text x="80" y="26" text-anchor="middle" fill="#FF8500" font-family="sans-serif" font-size="12" font-weight="600">Compute VM Instances</text>
  </g>

  <g transform="translate(375, 251)">
    <rect width="160" height="42" rx="6" fill="#242232" stroke="#3E3955" />
    <text x="80" y="26" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600">Blob Storage &amp; RBAC</text>
  </g>
</svg>

